[project]
name = "renovation-gantt"
version = "2.0.0"
description = "Planificateur de projet de rénovation énergétique (diagramme de Gantt, loi MOP)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # textes du glossaire volontairement sur une ligne
